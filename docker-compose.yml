services:

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: becas_app
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: becas_uptex
      DB_USERNAME: becas_user
      DB_PASSWORD: becas_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis # Aseguramos que use Redis para las colas
      CACHE_DRIVER: redis    # <-- Agrega esta línea
      SESSION_DRIVER: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - becas_network

  # -------------------------------------------------------------
  # NUEVO: Worker de Colas (Para correos y procesos pesados)
  # -------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: becas_worker
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: becas_uptex
      DB_USERNAME: becas_user
      DB_PASSWORD: becas_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - becas_network

  # -------------------------------------------------------------
  # NUEVO: Cron (Para disparar los recordatorios de becas)
  # -------------------------------------------------------------
  cron:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: becas_cron
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: becas_uptex
      DB_USERNAME: becas_user
      DB_PASSWORD: becas_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - becas_network

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: becas_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:                                       # <-- AGREGA ESTA LÍNEA
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - becas_network

  db:
    image: mysql:8.4
    container_name: becas_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: becas_uptex
      MYSQL_USER: becas_user
      MYSQL_PASSWORD: becas_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot_password"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - becas_network

  redis:
    image: redis:7-alpine
    container_name: becas_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - becas_network


volumes:
  mysql_data:
  redis_data:

networks:
  becas_network:
    driver: bridge